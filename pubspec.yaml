name: smack_talking_scoreboard_v3
description: A scoreboard app that talks smack for you
version: 2.2.0+7
publish_to: none

environment:
  sdk: ">=2.18.2 <4.0.0"
  flutter: ^3.3.3

dependencies:
  bloc: ^8.1.2
  build_runner: ^2.2.0
  collection: ^1.16.0
  confetti: ^0.7.0
